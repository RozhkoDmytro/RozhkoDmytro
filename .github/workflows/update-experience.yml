name: Update commercial Go tenure

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update tenure text in README
        run: |
          python3 << 'PY'
          import re
          from datetime import date
          from pathlib import Path

          START = date(2025, 4, 1)
          today = date.today()

          # Inclusive month count: first month (Apr 2025) and current month both full
          months_total = (today.year - START.year) * 12 + (today.month - START.month) + 1
          years = months_total // 12
          months = months_total % 12

          parts = []
          if years:
              parts.append(f"{years}y")
          if months:
              parts.append(f"{months}m")
          tenure = " ".join(parts) if parts else "1m"
          replacement = (
              f"<!-- tenure:start --><strong>{tenure} commercial Go</strong><!-- tenure:end -->"
          )

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"<!-- tenure:start -->.*?<!-- tenure:end -->",
              replacement,
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit("Tenure markers not found in README.md")
          readme.write_text(updated, encoding="utf-8")
          print("Tenure:", tenure)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update commercial Go tenure in README"
          git push
